[project]
name = "wordpress-mcp-server"
version = "0.1.0"
description = "MCP server for WordPress REST API - manage posts, pages, and categories"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.9.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
wordpress-mcp = "wordpress_server:main"
